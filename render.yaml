# Base PostgreSQL utilisée par l'application FamilyTask.
databases:
  - name: familytask-db
    # Le plan gratuit convient à l'environnement de démonstration et de test.
    plan: free

# API Python déployée sur Render.
services:
  - type: web
    name: familytask-api
    runtime: python
    plan: free
    rootDir: familytask/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Récupère automatiquement l'URL de connexion de la base PostgreSQL.
      - key: DATABASE_URL
        fromDatabase:
          name: familytask-db
          property: connectionString
      # La valeur secrète doit être renseignée dans le tableau de bord Render.
      - key: AI_TOKEN
        sync: false

  # Interface Vue publiée comme site statique.
  - type: web
    name: familytask-front
    runtime: static
    rootDir: familytask/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Utilise l'adresse publique du service API pour les appels frontend.
      - key: VITE_API_URL
        fromService:
          type: web
          name: familytask-api
          property: host
    routes:
      # Redirige les routes Vue vers l'application monopage.
      - type: rewrite
        source: /*
        destination: /index.html
